<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0716">
  <title>Connection needed | Zuychin Arcade</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: dark; background: #0B0716; color: #EDEAFB; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 440px; }
    img { display: block; width: 96px; height: 96px; margin-bottom: 24px; }
    h1 { font-size: clamp(1.75rem, 7vw, 2.5rem); line-height: 1.15; margin: 0 0 16px; }
    p { font-size: 1rem; line-height: 1.6; color: #C4BCDF; margin: 0 0 24px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px; border-radius: 12px; background: #2EE6FF; color: #0B0716; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #FF2E88; outline-offset: 4px; }
    ::selection { background: #2EE6FF; color: #0B0716; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Zuychin Arcade controller logo" width="96" height="96">
    <h1>Your table needs a connection</h1>
    <p>Multiplayer games need an internet connection. Reconnect, then try again. If you were in a room, the arcade will check whether your seat is still available.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
